<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>동내로88 해밀 - 주문관리</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  body { background:#f4f6fa; color:#1a2b4a; padding-bottom:70px; }
  .panel { display:none; padding:14px; max-width:760px; margin:0 auto; }
  .panel.active { display:block; }
  .menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .menu-card { background:#fff; border:2px solid #d6e0f0; border-radius:14px; padding:12px 8px; text-align:center; position:relative; }
  .menu-card .name { font-size:16px; font-weight:bold; margin-bottom:6px; }
  .menu-card .name .hot { color:#c0392b; }
  .menu-card .name .ice { color:#2475d6; }
  .qty-row { display:flex; align-items:center; justify-content:center; gap:10px; }
  .qty-btn { width:38px; height:38px; border:none; border-radius:10px; background:#2475d6; color:#fff; font-size:22px; font-weight:bold; cursor:pointer; }
  .qty-btn.minus { background:#9fb3cc; }
  .qty-num { font-size:20px; font-weight:bold; min-width:26px; }
  .menu-card.soldout .qty-row { visibility:hidden; }
  .soldout-badge { display:none; position:absolute; inset:0; background:rgba(40,40,40,.78); color:#fff; border-radius:12px; align-items:center; justify-content:center; font-size:20px; font-weight:bold; letter-spacing:1px; }
  .menu-card.soldout .soldout-badge { display:flex; }
  .tumbler-box { background:#fff; border:2px solid #d6e0f0; border-radius:14px; padding:12px 14px; margin-top:10px; }
  .tumbler-check { display:flex; align-items:center; gap:10px; cursor:pointer; }
  .tumbler-check input { width:24px; height:24px; }
  .tumbler-check label { font-size:16px; font-weight:bold; cursor:pointer; }
  .tumbler-note { font-size:12px; color:#c0392b; margin-top:8px; }
  .cart-box { background:#eaf1fb; border-radius:14px; padding:12px 14px; margin-top:10px; }
  .cart-box .title { font-size:13px; color:#5a6b88; margin-bottom:6px; }
  .cart-list { font-size:15px; line-height:1.6; }
  .cart-total { font-size:17px; font-weight:bold; margin-top:6px; }
  .my-no { font-size:16px; font-weight:bold; color:#2475d6; margin-top:6px; }
  .order-btn { width:100%; background:#2475d6; color:#fff; border:none; border-radius:14px; padding:16px; font-size:19px; font-weight:bold; margin-top:10px; cursor:pointer; }
  .order-btn:disabled { background:#b9c6da; }
  .overlay { display:none; position:fixed; inset:0; background:rgba(20,40,80,.6); z-index:100; align-items:center; justify-content:center; padding:16px; }
  .overlay.show { display:flex; }
  .done-modal { background:#fff; border-radius:24px; width:100%; max-width:520px; height:66vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .done-modal .check { font-size:60px; }
  .done-modal .msg { font-size:26px; font-weight:bold; margin-top:12px; }
  .done-modal .bignum { font-size:90px; font-weight:900; color:#2475d6; line-height:1.1; margin:10px 0; }
  .done-modal .remember { font-size:18px; color:#c0392b; font-weight:bold; margin-top:8px; }
  .done-modal .closebtn { margin-top:24px; background:#2475d6; color:#fff; border:none; border-radius:14px; padding:14px 40px; font-size:18px; font-weight:bold; cursor:pointer; }
  .col-title { font-size:15px; font-weight:bold; color:#5a6b88; margin:14px 0 8px; }
  .order-card { background:#fff; border:2px solid #d6e0f0; border-radius:14px; padding:14px; margin-bottom:10px; }
  .order-card.waiting { border-color:#2475d6; }
  .order-card.warn { border-color:#e02424; background:#fff3f3; }
  .order-card.done { opacity:.6; }
  .oc-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .oc-no { font-size:22px; font-weight:900; color:#2475d6; }
  .oc-time { font-size:12px; color:#8a97ad; }
  .oc-time.warn { color:#e02424; font-weight:bold; }
  .tumbler-badge { display:inline-block; background:#1fa463; color:#fff; font-size:13px; font-weight:bold; padding:4px 10px; border-radius:20px; }
  .oc-items { font-size:15px; line-height:1.6; margin-bottom:10px; }
  .oc-btns { display:flex; gap:8px; flex-wrap:wrap; }
  .oc-btns button { flex:1; min-width:70px; border:none; border-radius:10px; padding:11px 6px; font-size:14px; font-weight:bold; cursor:pointer; }
  .b-call { background:#f39c12; color:#fff; }
  .b-done { background:#2475d6; color:#fff; }
  .b-wait { background:#9fb3cc; color:#fff; }
  .b-del { background:#fff; color:#e02424; border:2px solid #e02424; }
  .empty { text-align:center; color:#aab4c6; padding:24px; font-size:14px; }
  .total-box { background:#1a2b4a; color:#fff; border-radius:18px; padding:22px; text-align:center; margin-bottom:14px; }
  .total-box .num { font-size:46px; font-weight:900; }
  .total-box .label { font-size:13px; opacity:.8; }
  .stat-row { background:#fff; border-radius:10px; padding:12px 14px; margin-bottom:8px; display:flex; justify-content:space-between; font-size:15px; }
  .stat-row .cnt { font-weight:bold; color:#2475d6; }
  .sec-title { font-size:14px; font-weight:bold; color:#5a6b88; margin:16px 0 8px; }
  .soldout-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .so-toggle { border:2px solid #d6e0f0; background:#fff; border-radius:10px; padding:12px 6px; font-size:14px; font-weight:bold; cursor:pointer; }
  .so-toggle.off { background:#e02424; color:#fff; border-color:#e02424; }
  .reset-btn { width:100%; background:#fff; border:2px solid #e02424; color:#e02424; border-radius:12px; padding:14px; font-size:15px; font-weight:bold; margin-top:18px; cursor:pointer; }
  .tabs { position:fixed; bottom:0; left:0; right:0; display:flex; background:#fff; border-top:2px solid #e0e7f2; z-index:50; }
  .tab { flex:1; padding:14px 0; text-align:center; font-size:14px; font-weight:bold; color:#9aa6ba; cursor:pointer; position:relative; }
  .tab.active { color:#2475d6; }
  .tab .badge { position:absolute; top:6px; right:30%; background:#e02424; color:#fff; font-size:11px; font-weight:bold; min-width:18px; height:18px; line-height:18px; border-radius:9px; padding:0 4px; display:none; }
  .tab .badge.show { display:inline-block; }
</style>
</head>
<body>

<div class="panel active" id="orderPanel">
  <div class="menu-grid" id="menuGrid"></div>
  <div class="tumbler-box">
    <div class="tumbler-check">
      <input type="checkbox" id="tumblerChk">
      <label for="tumblerChk">🥤 텀블러 사용</label>
    </div>
    <div class="tumbler-note">※ 텀블러가 아닌 음료는 분리해서 주문해 주세요.</div>
  </div>
  <div class="cart-box">
    <div class="title">현재 주문 내역</div>
    <div class="cart-list" id="cartList">선택된 메뉴가 없습니다.</div>
    <div class="cart-total" id="cartTotal">총 0잔</div>
    <div class="my-no" id="myNo">내 주문번호: 1번</div>
  </div>
  <button class="order-btn" id="orderBtn" disabled>주문하기</button>
</div>

<div class="panel" id="manPanel">
  <div class="col-title">⏳ 대기 중</div>
  <div id="waitList"></div>
  <div class="col-title">✅ 완료</div>
  <div id="doneList"></div>
</div>

<div class="panel" id="statPanel">
  <div class="total-box">
    <div class="num" id="totalNum">0</div>
    <div class="label">오늘 총 판매 잔</div>
  </div>
  <div class="sec-title">메뉴별 판매</div>
  <div id="statList"></div>
  <div class="sec-title">메뉴 품절 관리</div>
  <div class="soldout-grid" id="soldoutGrid"></div>
  <button class="reset-btn" id="resetBtn">오늘 데이터 초기화</button>
</div>

<div class="overlay" id="overlay">
  <div class="done-modal">
    <div class="check">✅</div>
    <div class="msg">주문이 완료되었습니다</div>
    <div class="bignum" id="modalNum">1번</div>
    <div class="remember">⚠ 본인 주문번호를 꼭 기억해 주세요!</div>
    <button class="closebtn" id="modalClose">확인</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="orderPanel">주문</div>
  <div class="tab" data-tab="manPanel">주문관리<span class="badge" id="manBadge">0</span></div>
  <div class="tab" data-tab="statPanel">집계</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC989VKQk_3A9A8mKgu-Xb_8PL-xTwWLzw",
  authDomain: "medihub-cafe.firebaseapp.com",
  databaseURL: "https://medihub-cafe-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "medihub-cafe",
  storageBucket: "medihub-cafe.firebasestorage.app",
  messagingSenderId: "492629329248",
  appId: "1:492629329248:web:d1596f3ae376b9ba0a8a05"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const MENUS = [
  { id:'ame_h', name:'아메리카노', temp:'HOT' },
  { id:'ame_i', name:'아메리카노', temp:'ICE' },
  { id:'latte_h', name:'라떼', temp:'HOT' },
  { id:'latte_i', name:'라떼', temp:'ICE' },
  { id:'tea', name:'아이스티', temp:'' },
  { id:'ashotchu', name:'아샷추', temp:'' },
  { id:'espresso', name:'에스프레소', temp:'' }
];

function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

let state = { orders:[], soldout:{}, lastCall:null };
let cart = {};
MENUS.forEach(m=>cart[m.id]=0);
let lastCallSeen = null;

const ref = db.ref('hemil/'+todayKey());
ref.on('value', snap=>{
  const v = snap.val() || {};
  state.orders = v.orders ? Object.values(v.orders) : [];
  state.soldout = v.soldout || {};
  state.lastCall = v.lastCall || null;
  if(state.lastCall && state.lastCall.ts !== lastCallSeen){
    if(lastCallSeen !== null && isManTabActive()){
      speakCall(state.lastCall.no);
    }
    lastCallSeen = state.lastCall.ts;
  }
  renderAll();
});

function isManTabActive(){ return document.getElementById('manPanel').classList.contains('active'); }

/* ===== 음성: 숫자를 '일,이,삼...'으로 읽고 남자 목소리로 ===== */
const NUM_KO = ['영','일','이','삼','사','오','육','칠','팔','구'];
function numToKorean(n){
  n = parseInt(n,10);
  if(isNaN(n)) return '';
  if(n === 0) return '영';
  let units = ['','십','백','천'];
  let bigUnits = ['','만','억'];
  let result = '';
  let groupIdx = 0;
  while(n > 0){
    let group = n % 10000;
    if(group > 0){
      let g = '';
      let gu = ['','십','백','천'];
      let temp = group;
      let digits = [];
      for(let i=0;i<4;i++){ digits.push(temp%10); temp=Math.floor(temp/10); }
      for(let i=3;i>=0;i--){
        let d = digits[i];
        if(d > 0){
          if(i > 0){
            if(d === 1) g += gu[i];
            else g += NUM_KO[d] + gu[i];
          } else {
            g += NUM_KO[d];
          }
        }
      }
      result = g + bigUnits[groupIdx] + result;
    }
    n = Math.floor(n/10000);
    groupIdx++;
  }
  return result;
}

let maleVoice = null;
function pickVoice(){
  const voices = window.speechSynthesis.getVoices();
  const ko = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith('ko'));
  maleVoice = ko.find(v=>/male|남|injoon|minsik|gerald/i.test(v.name))
    || ko.find(v=>/google/i.test(v.name))
    || ko[0] || voices[0] || null;
}
if('speechSynthesis' in window){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}

function speak(text, repeat){
  if(!('speechSynthesis' in window)) return;
  repeat = repeat || 1;
  window.speechSynthesis.cancel();
  for(let i=0;i<repeat;i++){
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = 0.95;
    u.pitch = 0.7;   // 낮은 톤 = 남성적
    u.volume = 1.0;
    if(maleVoice) u.voice = maleVoice;
    window.speechSynthesis.speak(u);
  }
}

function speakOrderDone(no){
  speak(numToKorean(no)+'번 주문 완료되었습니다.', 1);
}
function speakCall(no){
  speak(numToKorean(no)+'번 음료 준비되었습니다.', 2);
}

/* ===== 주문번호: 빈 번호 채우기 ===== */
function nextNo(){
  const used = state.orders.map(o=>o.no).sort((a,b)=>a-b);
  let n = 1;
  for(const u of used){ if(u === n) n++; else if(u > n) break; }
  return n;
}

/* ===== 렌더 ===== */
function renderMenu(){
  const grid = document.getElementById('menuGrid');
  grid.innerHTML = '';
  MENUS.forEach(m=>{
    const sold = !!state.soldout[m.id];
    const div = document.createElement('div');
    div.className = 'menu-card' + (sold?' soldout':'');
    const tempHtml = m.temp ? ' <span class="'+(m.temp==='HOT'?'hot':'ice')+'">'+m.temp+'</span>' : '';
    div.innerHTML =
      '<div class="name">'+m.name+tempHtml+'</div>'+
      '<div class="qty-row">'+
        '<button class="qty-btn minus" data-id="'+m.id+'" data-d="-1">−</button>'+
        '<span class="qty-num" id="q_'+m.id+'">'+cart[m.id]+'</span>'+
        '<button class="qty-btn" data-id="'+m.id+'" data-d="1">+</button>'+
      '</div>'+
      '<div class="soldout-badge">SOLD OUT</div>';
    grid.appendChild(div);
  });
  grid.querySelectorAll('.qty-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.id, d = parseInt(b.dataset.d,10);
      if(state.soldout[id]) return;
      cart[id] = Math.max(0, cart[id]+d);
      document.getElementById('q_'+id).textContent = cart[id];
      renderCart();
    });
  });
}

function renderCart(){
  const list = document.getElementById('cartList');
  let total = 0; let lines = [];
  MENUS.forEach(m=>{
    if(cart[m.id]>0){ total += cart[m.id]; lines.push(m.name+(m.temp?'('+m.temp+')':'')+' '+cart[m.id]+'잔'); }
  });
  list.textContent = lines.length ? lines.join(', ') : '선택된 메뉴가 없습니다.';
  document.getElementById('cartTotal').textContent = '총 '+total+'잔';
  document.getElementById('myNo').textContent = '내 주문번호: '+nextNo()+'번';
  document.getElementById('orderBtn').disabled = total===0;
}

function elapsedMin(ts){ return Math.floor((Date.now()-ts)/60000); }

function renderManage(){
  const wait = document.getElementById('waitList');
  const done = document.getElementById('doneList');
  wait.innerHTML=''; done.innerHTML='';
  const waiting = state.orders.filter(o=>!o.done).sort((a,b)=>a.no-b.no);
  const finished = state.orders.filter(o=>o.done).sort((a,b)=>b.ts-a.ts);
  if(!waiting.length) wait.innerHTML='<div class="empty">대기 중인 주문이 없습니다.</div>';
  waiting.forEach(o=>wait.appendChild(card(o,false)));
  if(!finished.length) done.innerHTML='<div class="empty">완료된 주문이 없습니다.</div>';
  finished.forEach(o=>done.appendChild(card(o,true)));
  const cnt = waiting.length;
  const badge = document.getElementById('manBadge');
  badge.textContent = cnt;
  badge.classList.toggle('show', cnt>0);
}

function card(o, isDone){
  const div = document.createElement('div');
  const min = elapsedMin(o.ts);
  const warn = !isDone && min>=5;
  div.className = 'order-card '+(isDone?'done':'waiting')+(warn?' warn':'');
  const items = o.items.map(it=>it.name+(it.temp?'('+it.temp+')':'')+' '+it.qty+'잔').join(', ');
  div.innerHTML =
    '<div class="oc-head">'+
      '<span class="oc-no">'+o.no+'번</span>'+
      (o.tumbler?'<span class="tumbler-badge">🥤 텀블러</span>':'<span class="oc-time'+(warn?' warn':'')+'">'+min+'분 경과'+(warn?' ⚠':'')+'</span>')+
    '</div>'+
    (o.tumbler?'<div class="oc-time'+(warn?' warn':'')+'" style="margin-bottom:6px">'+min+'분 경과'+(warn?' ⚠':'')+'</div>':'')+
    '<div class="oc-items">'+items+'</div>'+
    '<div class="oc-btns"></div>';
  const btns = div.querySelector('.oc-btns');
  if(!isDone){
    const call = document.createElement('button'); call.className='b-call'; call.textContent='🔊 음료';
    call.addEventListener('click', ()=>{ ref.child('lastCall').set({no:o.no, ts:Date.now()}); });
    const dn = document.createElement('button'); dn.className='b-done'; dn.textContent='완료';
    dn.addEventListener('click', ()=>{ ref.child('orders/'+o.key+'/done').set(true); });
    const del = document.createElement('button'); del.className='b-del'; del.textContent='삭제';
    del.addEventListener('click', ()=>{ if(confirm(o.no+'번 주문을 삭제할까요?')) ref.child('orders/'+o.key).remove(); });
    btns.appendChild(call); btns.appendChild(dn); btns.appendChild(del);
  } else {
    const back = document.createElement('button'); back.className='b-wait'; back.textContent='대기로';
    back.addEventListener('click', ()=>{ ref.child('orders/'+o.key+'/done').set(false); });
    const del = document.createElement('button'); del.className='b-del'; del.textContent='삭제';
    del.addEventListener('click', ()=>{ if(confirm(o.no+'번 주문을 삭제할까요?')) ref.child('orders/'+o.key).remove(); });
    btns.appendChild(back); btns.appendChild(del);
  }
  return div;
}

function renderStat(){
  let total=0; const byMenu={};
  MENUS.forEach(m=>byMenu[m.id]=0);
  state.orders.forEach(o=>o.items.forEach(it=>{ total+=it.qty; if(byMenu[it.id]!==undefined) byMenu[it.id]+=it.qty; }));
  document.getElementById('totalNum').textContent = total;
  const sl = document.getElementById('statList'); sl.innerHTML='';
  MENUS.forEach(m=>{
    const row=document.createElement('div'); row.className='stat-row';
    row.innerHTML='<span>'+m.name+(m.temp?'('+m.temp+')':'')+'</span><span class="cnt">'+byMenu[m.id]+'잔</span>';
    sl.appendChild(row);
  });
  const sg = document.getElementById('soldoutGrid'); sg.innerHTML='';
  MENUS.forEach(m=>{
    const sold=!!state.soldout[m.id];
    const t=document.createElement('button');
    t.className='so-toggle'+(sold?' off':'');
    t.textContent=m.name+(m.temp?'('+m.temp+')':'')+(sold?' 품절':'');
    t.addEventListener('click', ()=>{ ref.child('soldout/'+m.id).set(!sold); });
    sg.appendChild(t);
  });
}

function renderAll(){ renderMenu(); renderCart(); renderManage(); renderStat(); }

/* ===== 주문하기 ===== */
document.getElementById('orderBtn').addEventListener('click', ()=>{
  const items = MENUS.filter(m=>cart[m.id]>0).map(m=>({id:m.id,name:m.name,temp:m.temp,qty:cart[m.id]}));
  if(!items.length) return;
  const no = nextNo();
  const tumbler = document.getElementById('tumblerChk').checked;
  const key = ref.child('orders').push().key;
  ref.child('orders/'+key).set({ key:key, no:no, items:items, tumbler:tumbler, done:false, ts:Date.now() });
  speakOrderDone(no);
  document.getElementById('modalNum').textContent = no+'번';
  document.getElementById('overlay').classList.add('show');
  MENUS.forEach(m=>cart[m.id]=0);
  document.getElementById('tumblerChk').checked=false;
  renderMenu(); renderCart();
});
document.getElementById('modalClose').addEventListener('click', ()=>{ document.getElementById('overlay').classList.remove('show'); });

/* ===== 초기화 ===== */
document.getElementById('resetBtn').addEventListener('click', ()=>{
  const pw = prompt('초기화 비밀번호를 입력하세요.');
  if(pw==='1234'){ ref.remove(); lastCallSeen=null; alert('오늘 데이터가 초기화되었습니다.'); }
  else if(pw!==null){ alert('비밀번호가 올바르지 않습니다.'); }
});

/* ===== 탭 전환 ===== */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById(t.dataset.tab).classList.add('active');
    // 음성 자동재생 권한 활성화용
    if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(''); window.speechSynthesis.speak(u); }
  });
});
