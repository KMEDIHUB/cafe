<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>동내로88 해밀 - 주문관리</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#ffffff; color:#1a2b3c; padding-bottom:84px; }

  .panel { display:none; padding:18px; max-width:900px; margin:0 auto; }
  .panel.active { display:block; }

  /* 주문 화면 */
  .next-no { background:#1565d8; color:#fff; border-radius:14px; padding:16px; text-align:center; margin-bottom:16px; }
  .next-no .label { font-size:13px; opacity:.85; }
  .next-no .num { font-size:30px; font-weight:800; margin-top:2px; }

  .menu-list { display:flex; flex-direction:column; gap:12px; }
  .menu-item { display:flex; align-items:center; justify-content:space-between; background:#fff; border:2px solid #cdd9e8; border-radius:14px; padding:16px 18px; }
  .menu-item .name { font-size:19px; font-weight:700; }
  .menu-item .name .opt { font-size:13px; font-weight:700; margin-left:6px; padding:2px 8px; border-radius:6px; }
  .opt.hot { background:#fde2e2; color:#c0392b; }
  .opt.ice { background:#dceaff; color:#1565d8; }
  .qty-ctrl { display:flex; align-items:center; gap:14px; }
  .qty-btn { width:42px; height:42px; border-radius:10px; border:none; font-size:24px; font-weight:800; cursor:pointer; }
  .qty-btn.minus { background:#e8eef6; color:#1a2b3c; }
  .qty-btn.plus { background:#1565d8; color:#fff; }
  .qty-num { font-size:20px; font-weight:800; min-width:24px; text-align:center; }

  .summary { margin-top:18px; background:#f4f8ff; border:2px solid #1565d8; border-radius:14px; padding:16px; }
  .summary .title { font-size:14px; font-weight:700; color:#1565d8; margin-bottom:8px; }
  .summary .line { display:flex; justify-content:space-between; font-size:16px; padding:4px 0; }
  .summary .total { border-top:1px dashed #9bb8e0; margin-top:8px; padding-top:10px; font-size:18px; font-weight:800; }
  .order-btn { width:100%; margin-top:14px; background:#1565d8; color:#fff; border:none; border-radius:12px; padding:18px; font-size:19px; font-weight:800; cursor:pointer; }
  .order-btn:disabled { background:#b5c4d8; cursor:default; }
  .toast { position:fixed; left:50%; top:40%; transform:translateX(-50%); background:#1565d8; color:#fff; padding:22px 30px; border-radius:16px; font-size:22px; font-weight:800; box-shadow:0 8px 30px rgba(0,0,0,.25); z-index:100; display:none; text-align:center; }

  /* 주문관리 */
  .section-title { font-size:15px; font-weight:800; color:#1a2b3c; margin:18px 0 10px; display:flex; align-items:center; gap:8px; }
  .badge { background:#e53935; color:#fff; font-size:13px; font-weight:800; border-radius:20px; padding:2px 10px; }
  .card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .order-card { border-radius:14px; padding:14px 16px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  .order-card.wait { background:#fff; border:2px solid #1565d8; }
  .order-card.done { background:#f0f2f5; border:2px solid #d6dbe1; opacity:.85; }
  .oc-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .oc-no { font-size:20px; font-weight:800; color:#1565d8; }
  .order-card.done .oc-no { color:#7a8595; }
  .oc-time { font-size:12px; color:#9aa5b1; }
  .oc-items { font-size:15px; line-height:1.7; }
  .oc-btns { display:flex; gap:8px; margin-top:12px; }
  .oc-btns button { flex:1; border:none; border-radius:9px; padding:11px; font-size:14px; font-weight:800; cursor:pointer; }
  .btn-done { background:#1565d8; color:#fff; }
  .btn-undo { background:#e8eef6; color:#1a2b3c; }
  .btn-del { background:#fde2e2; color:#c0392b; }
  .empty { text-align:center; color:#aab4c0; padding:26px; font-size:14px; }

  /* 집계 */
  .total-box { background:#1565d8; color:#fff; border-radius:16px; padding:24px; text-align:center; margin-bottom:16px; }
  .total-box .num { font-size:46px; font-weight:800; }
  .total-box .label { font-size:13px; opacity:.85; }
  .stat-row { background:#fff; border:1px solid #e0e6ee; border-radius:10px; padding:14px 16px; margin-bottom:8px; display:flex; justify-content:space-between; font-size:16px; }
  .stat-row .cnt { font-weight:800; color:#1565d8; }
  .sub-head { font-size:14px; font-weight:800; color:#1a2b3c; margin:22px 0 10px; }
  .reset-btn { width:100%; background:#fff; border:2px solid #c0392b; color:#c0392b; border-radius:10px; padding:14px; font-size:15px; font-weight:800; margin-top:20px; cursor:pointer; }

  /* 하단 탭 */
  .tabs { position:fixed; bottom:0; left:0; right:0; display:flex; background:#fff; border-top:2px solid #e0e6ee; z-index:20; }
  .tab { flex:1; padding:14px 6px; text-align:center; font-size:14px; font-weight:800; color:#9aa5b1; cursor:pointer; position:relative; }
  .tab.active { color:#1565d8; }
  .tab.active::after { content:''; position:absolute; top:0; left:20%; right:20%; height:3px; background:#1565d8; border-radius:3px; }
  .tab .tab-badge { position:absolute; top:6px; right:24%; background:#e53935; color:#fff; font-size:11px; font-weight:800; border-radius:20px; padding:1px 7px; display:none; }

  .status { text-align:center; font-size:11px; color:#aab4c0; padding:8px; }
</style>
</head>
<body>

<!-- 주문 화면 -->
<div class="panel active" id="order">
  <div class="next-no">
    <div class="label">이번 주문번호</div>
    <div class="num" id="nextNo">-</div>
  </div>
  <div class="menu-list" id="menuList"></div>
  <div class="summary">
    <div class="title">현재 주문 내역</div>
    <div id="summaryLines"><div class="line"><span style="color:#9aa5b1">메뉴를 담아주세요</span></div></div>
    <div class="line total"><span>총 잔 수</span><span id="summaryTotal">0 잔</span></div>
    <button class="order-btn" id="orderBtn" disabled>주문하기</button>
  </div>
</div>

<!-- 주문관리 -->
<div class="panel" id="manage">
  <div class="section-title">⏳ 대기 중 <span class="badge" id="waitBadge" style="display:none">0건</span></div>
  <div class="card-grid" id="waitingList"></div>
  <div class="section-title">✅ 완료</div>
  <div class="card-grid" id="doneList"></div>
</div>

<!-- 집계 -->
<div class="panel" id="stat">
  <div class="total-box">
    <div class="num" id="totalCount">0</div>
    <div class="label">오늘 총 판매 잔</div>
  </div>
  <div class="sub-head">오늘 메뉴별 판매</div>
  <div id="statList"></div>
  <div class="sub-head">일자별 판매 현황</div>
  <div id="dailyList"></div>
  <button class="reset-btn" id="resetBtn">오늘 데이터 초기화</button>
</div>

<!-- 하단 탭 -->
<div class="tabs">
  <div class="tab active" data-tab="order">주문</div>
  <div class="tab" data-tab="manage">주문관리<span class="tab-badge" id="tabBadge">0</span></div>
  <div class="tab" data-tab="stat">집계</div>
</div>

<div class="toast" id="toast"></div>
<div class="status" id="connStatus">Firebase 연결 중...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, update, remove, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC989VKQk_3A9A8mKgu-Xb_8PL-xTwWLzw",
  authDomain: "medihub-cafe.firebaseapp.com",
  databaseURL: "https://medihub-cafe-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "medihub-cafe",
  storageBucket: "medihub-cafe.firebasestorage.app",
  messagingSenderId: "492629329248",
  appId: "1:492629329248:web:d1596f3ae376b9ba0a8a05"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const MENUS = [
  { name:'아메리카노', opt:'HOT', cls:'hot' },
  { name:'아메리카노', opt:'ICE', cls:'ice' },
  { name:'라떼', opt:'HOT', cls:'hot' },
  { name:'라떼', opt:'ICE', cls:'ice' },
  { name:'아이스티', opt:'', cls:'ice' },
  { name:'아샷추', opt:'', cls:'ice' },
];
function label(m){ return m.opt ? m.name + ' (' + m.opt + ')' : m.name; }

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

let ORDERS = {};      // 오늘 주문 { key: {no, items, total, done, time, ts} }
let DAILY = {};       // 일자별 누적 { '2026-06-02': total }
let cart = MENUS.map(()=>0);

const ORDERS_PATH = 'orders/' + todayStr();
const DAILY_PATH = 'daily';

// 실시간 구독
onValue(ref(db, ORDERS_PATH), (snap)=>{
  ORDERS = snap.val() || {};
  document.getElementById('connStatus').textContent = '✅ Firebase 연결됨 (실시간 공유)';
  renderAll();
});
onValue(ref(db, DAILY_PATH), (snap)=>{
  DAILY = snap.val() || {};
  renderDaily();
});

// 메뉴 렌더
const menuList = document.getElementById('menuList');
MENUS.forEach((m,i)=>{
  const div = document.createElement('div');
  div.className='menu-item';
  div.innerHTML = `<div class="name">${m.name}${m.opt?`<span class="opt ${m.cls}">${m.opt}</span>`:''}</div>
    <div class="qty-ctrl">
      <button class="qty-btn minus" data-i="${i}" data-d="-1">−</button>
      <span class="qty-num" id="q${i}">0</span>
      <button class="qty-btn plus" data-i="${i}" data-d="1">+</button>
    </div>`;
  menuList.appendChild(div);
});
menuList.querySelectorAll('.qty-btn').forEach(b=>{
  b.addEventListener('click', ()=>{
    const i=+b.dataset.i, d=+b.dataset.d;
    cart[i]=Math.max(0, cart[i]+d);
    renderCart();
  });
});

function renderCart(){
  let total=0, lines='';
  MENUS.forEach((m,i)=>{
    document.getElementById('q'+i).textContent = cart[i];
    if(cart[i]>0){ total+=cart[i]; lines+=`<div class="line"><span>${label(m)}</span><span>${cart[i]} 잔</span></div>`; }
  });
  document.getElementById('summaryLines').innerHTML = lines || '<div class="line"><span style="color:#9aa5b1">메뉴를 담아주세요</span></div>';
  document.getElementById('summaryTotal').textContent = total + ' 잔';
  document.getElementById('orderBtn').disabled = total===0;
}

// 다음 주문번호: 남아있는 주문번호 중 빈 번호 채우기
function getNextNo(){
  const used = Object.values(ORDERS).map(o=>o.no).sort((a,b)=>a-b);
  let n=1;
  for(const u of used){ if(u===n) n++; else if(u>n) break; }
  return n;
}
function renderNextNo(){ document.getElementById('nextNo').textContent = getNextNo() + '번'; }

// 주문하기
document.getElementById('orderBtn').addEventListener('click', async ()=>{
  const total = cart.reduce((a,b)=>a+b,0);
  if(total===0) return;
  const no = getNextNo();
  const items = {};
  MENUS.forEach((m,i)=>{ if(cart[i]>0) items[label(m)] = cart[i]; });
  const key = 'o' + Date.now();
  const now = new Date();
  await set(ref(db, ORDERS_PATH + '/' + key), {
    no, items, total, done:false,
    time: now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),
    ts: Date.now()
  });
  // 일자별 누적 +total
  const dref = ref(db, DAILY_PATH + '/' + todayStr());
  const cur = (await get(dref)).val() || 0;
  await set(dref, cur + total);

  cart = MENUS.map(()=>0);
  renderCart();
  showToast(no + '번째 주문이<br>접수되었습니다');
});

function showToast(html){
  const t=document.getElementById('toast');
  t.innerHTML=html; t.style.display='block';
  setTimeout(()=>{ t.style.display='none'; }, 1800);
}

async function toggleDone(key){
  const o = ORDERS[key]; if(!o) return;
  await update(ref(db, ORDERS_PATH + '/' + key), { done: !o.done });
}
async function delOrder(key){
  const o = ORDERS[key]; if(!o) return;
  if(!confirm(o.no + '번 주문을 삭제할까요?')) return;
  // 일자별 누적에서 차감
  const dref = ref(db, DAILY_PATH + '/' + todayStr());
  const cur = (await get(dref)).val() || 0;
  await set(dref, Math.max(0, cur - o.total));
  await remove(ref(db, ORDERS_PATH + '/' + key));
}
window.__toggleDone = toggleDone;
window.__delOrder = delOrder;

function renderManage(){
  const list = Object.entries(ORDERS).sort((a,b)=>a[1].no-b[1].no);
  const wait = list.filter(([k,o])=>!o.done);
  const done = list.filter(([k,o])=>o.done);

  const cardHtml = ([k,o], type)=>{
    const itemsHtml = Object.entries(o.items).map(([n,c])=>`${n} <b>${c}잔</b>`).join('<br>');
    const btns = type==='wait'
      ? `<button class="btn-done" onclick="__toggleDone('${k}')">완료</button><button class="btn-del" onclick="__delOrder('${k}')">삭제</button>`
      : `<button class="btn-undo" onclick="__toggleDone('${k}')">되돌리기</button><button class="btn-del" onclick="__delOrder('${k}')">삭제</button>`;
    return `<div class="order-card ${type}">
      <div class="oc-head"><span class="oc-no">${o.no}번</span><span class="oc-time">${o.time} · 총 ${o.total}잔</span></div>
      <div class="oc-items">${itemsHtml}</div>
      <div class="oc-btns">${btns}</div></div>`;
  };

  document.getElementById('waitingList').innerHTML = wait.length ? wait.map(e=>cardHtml(e,'wait')).join('') : '<div class="empty">대기 중인 주문이 없습니다</div>';
  document.getElementById('doneList').innerHTML = done.length ? done.map(e=>cardHtml(e,'done')).join('') : '<div class="empty">완료된 주문이 없습니다</div>';

  // 미처리 배지
  const n = wait.length;
  const wb = document.getElementById('waitBadge');
  const tb = document.getElementById('tabBadge');
  if(n>0){ wb.style.display='inline-block'; wb.textContent=n+'건'; tb.style.display='inline-block'; tb.textContent=n; }
  else { wb.style.display='none'; tb.style.display='none'; }
}

function renderStat(){
  const list = Object.values(ORDERS);
  const total = list.reduce((a,o)=>a+o.total,0);
  document.getElementById('totalCount').textContent = total;
  const counts = {};
  list.forEach(o=>{ Object.entries(o.items).forEach(([n,c])=>{ counts[n]=(counts[n]||0)+c; }); });
  const seen=[]; let html='';
  MENUS.forEach(m=>{ const l=label(m); if(seen.includes(l))return; seen.push(l);
    html+=`<div class="stat-row"><span>${l}</span><span class="cnt">${counts[l]||0} 잔</span></div>`; });
  document.getElementById('statList').innerHTML = html;
}

function renderDaily(){
  const days = Object.entries(DAILY).filter(([d,c])=>c>0).sort((a,b)=>b[0].localeCompare(a[0]));
  document.getElementById('dailyList').innerHTML = days.length
    ? days.map(([d,c])=>`<div class="stat-row"><span>${d}</span><span class="cnt">${c} 잔</span></div>`).join('')
    : '<div class="empty">판매 기록이 없습니다</div>';
}

function renderAll(){ renderNextNo(); renderManage(); renderStat(); }

// 탭
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById(t.dataset.tab).classList.add('active');
  });
});

// 초기화 (오늘 주문번호 1번부터)
document.getElementById('resetBtn').addEventListener('click', async ()=>{
  if(!confirm('오늘 주문 데이터를 모두 삭제할까요?\n(일자별 집계의 오늘 기록도 0으로 초기화됩니다)')) return;
  await remove(ref(db, ORDERS_PATH));
  await set(ref(db, DAILY_PATH + '/' + todayStr()), 0);
});

renderCart();
</script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v833ccba57c9e4d2798f2e76cebdd09a11778172276447" integrity="sha512-57MDmcccJXYtNnH+ZiBwzC4jb2rvgVCEokYN+L/nLlmO8rfYT/gIpW2A569iJ/3b+0UEasghjuZH/ma3wIs/EQ==" data-cf-beacon='{"version":"2024.11.0","token":"e4f3199a7ddd4604b191af5850394a99","r":1,"server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
