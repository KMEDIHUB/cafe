<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>동내로88 해밀 - 주문관리</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#f4f6fa; color:#1f2937; padding-bottom:80px; }
.app { max-width:760px; margin:0 auto; }

.panel { display:none; padding:16px; }
.panel.active { display:block; }

/* 주문 화면 */
.menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.menu-card { background:#fff; border:2px solid #dbe3ef; border-radius:14px; padding:14px 10px; text-align:center; position:relative; }
.menu-card.soldout { opacity:.55; }
.menu-card .name { font-size:17px; font-weight:800; margin-bottom:8px; }
.menu-card .temp { font-size:12px; font-weight:700; margin-bottom:6px; }
.hot { color:#dc2626; }
.ice { color:#2563eb; }
.qty-row { display:flex; align-items:center; justify-content:center; gap:12px; }
.qty-btn { width:40px; height:40px; border-radius:10px; border:none; font-size:22px; font-weight:800; cursor:pointer; background:#1d4ed8; color:#fff; }
.qty-btn:active { transform:scale(.92); }
.qty-btn.minus { background:#94a3b8; }
.qty-num { font-size:20px; font-weight:800; min-width:24px; }
.soldout-badge { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-8deg); background:#dc2626; color:#fff; font-size:18px; font-weight:900; padding:6px 14px; border-radius:8px; letter-spacing:1px; box-shadow:0 2px 8px rgba(0,0,0,.25); }

.summary { background:#fff; border:2px solid #1d4ed8; border-radius:14px; padding:14px; margin-top:14px; }
.summary h3 { font-size:14px; color:#1d4ed8; margin-bottom:8px; }
.summary .line { display:flex; justify-content:space-between; font-size:15px; padding:3px 0; }
.summary .total { font-size:18px; font-weight:800; border-top:1px dashed #cbd5e1; margin-top:6px; padding-top:8px; }
.summary .empty { color:#9ca3af; font-size:14px; }
.preorder-no { text-align:center; font-size:15px; font-weight:700; color:#1d4ed8; margin-top:8px; }

/* 텀블러 체크 */
.tumbler-wrap { margin-top:12px; }
.tumbler-check { display:flex; align-items:center; gap:12px; background:#fff; border:2px solid #dbe3ef; border-radius:14px; padding:14px; cursor:pointer; user-select:none; }
.tumbler-check .box { width:30px; height:30px; border:3px solid #94a3b8; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff; font-weight:900; }
.tumbler-check.on { border-color:#059669; background:#ecfdf5; }
.tumbler-check.on .box { background:#059669; border-color:#059669; }
.tumbler-check .label { font-size:16px; font-weight:800; }
.notice { font-size:13px; color:#dc2626; font-weight:700; margin-top:8px; text-align:center; }

.order-line { display:flex; gap:10px; margin-top:14px; }
.main-btn { flex:0 0 90px; background:#fff; border:2px solid #94a3b8; color:#475569; border-radius:14px; font-size:15px; font-weight:800; cursor:pointer; }
.submit-btn { flex:1; background:#1d4ed8; color:#fff; border:none; border-radius:14px; padding:18px; font-size:20px; font-weight:900; cursor:pointer; }
.submit-btn:active { transform:scale(.98); }
.submit-btn:disabled { background:#cbd5e1; }

/* 주문관리 */
.section-title { font-size:14px; font-weight:800; color:#64748b; margin:16px 0 8px; }
.order-card { background:#fff; border-radius:14px; padding:14px; margin-bottom:10px; border-left:6px solid #1d4ed8; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.order-card.warn { border-left-color:#dc2626; background:#fef2f2; }
.order-card.done { border-left-color:#94a3b8; opacity:.7; }
.oc-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.oc-no { font-size:20px; font-weight:900; color:#1d4ed8; }
.oc-time { font-size:12px; color:#94a3b8; }
.oc-warn { font-size:12px; color:#dc2626; font-weight:800; }
.oc-items { font-size:15px; line-height:1.6; }
.tumbler-badge { display:inline-block; background:#059669; color:#fff; font-size:13px; font-weight:800; padding:3px 10px; border-radius:8px; margin-bottom:6px; }
.oc-btns { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.oc-btns button { flex:1; min-width:80px; border:none; border-radius:10px; padding:12px 6px; font-size:14px; font-weight:800; cursor:pointer; }
.btn-call { background:#f59e0b; color:#fff; }
.btn-done { background:#1d4ed8; color:#fff; }
.btn-wait { background:#64748b; color:#fff; }
.btn-del { background:#fee2e2; color:#dc2626; }
.empty-msg { text-align:center; color:#9ca3af; padding:20px; font-size:14px; }

/* 집계 */
.total-box { background:#1d4ed8; color:#fff; border-radius:16px; padding:22px; text-align:center; margin-bottom:14px; }
.total-box .num { font-size:42px; font-weight:900; }
.total-box .label { font-size:13px; opacity:.85; }
.stat-row { background:#fff; border-radius:10px; padding:12px 14px; margin-bottom:7px; display:flex; justify-content:space-between; font-size:16px; }
.stat-row .cnt { font-weight:800; color:#1d4ed8; }
.soldout-section { background:#fff; border-radius:12px; padding:14px; margin:16px 0; }
.soldout-section h3 { font-size:14px; color:#64748b; margin-bottom:10px; }
.so-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #f1f5f9; }
.so-row:last-child { border-bottom:none; }
.so-name { font-size:15px; font-weight:700; }
.so-toggle { border:none; border-radius:20px; padding:8px 18px; font-size:14px; font-weight:800; cursor:pointer; }
.so-toggle.ok { background:#dcfce7; color:#16a34a; }
.so-toggle.no { background:#fee2e2; color:#dc2626; }
.reset-btn { width:100%; background:#fff; border:2px solid #dc2626; color:#dc2626; border-radius:10px; padding:14px; font-size:15px; font-weight:800; margin-top:18px; cursor:pointer; }

/* 하단 탭 */
.tabbar { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:2px solid #e2e8f0; display:flex; max-width:760px; margin:0 auto; z-index:20; }
.tab { flex:1; padding:14px 4px; text-align:center; font-size:14px; font-weight:800; color:#94a3b8; cursor:pointer; position:relative; }
.tab.active { color:#1d4ed8; }
.tab .badge { position:absolute; top:6px; right:30%; background:#dc2626; color:#fff; font-size:11px; font-weight:800; min-width:18px; height:18px; line-height:18px; border-radius:9px; padding:0 4px; }

/* 주문완료 팝업 */
.modal { display:none; position:fixed; inset:0; background:rgba(15,23,42,.75); z-index:50; align-items:center; justify-content:center; padding:20px; }
.modal.show { display:flex; }
.modal-box { background:#fff; border-radius:24px; width:100%; max-width:520px; height:66vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
.modal-box .check { font-size:60px; }
.modal-box .ttl { font-size:24px; font-weight:900; margin:14px 0 6px; }
.modal-box .ono { font-size:72px; font-weight:900; color:#1d4ed8; line-height:1.1; }
.modal-box .ono small { font-size:30px; }
.modal-box .remember { font-size:18px; font-weight:800; color:#dc2626; margin-top:16px; background:#fef2f2; padding:12px 18px; border-radius:12px; }
.modal-box .cnt { font-size:16px; color:#64748b; margin-top:14px; }
.modal-box .close { margin-top:20px; background:#1d4ed8; color:#fff; border:none; border-radius:14px; padding:16px 50px; font-size:18px; font-weight:900; cursor:pointer; }
</style>
</head>
<body>
<div class="app">
  <!-- 주문 -->
  <div class="panel active" id="orderPanel">
    <div class="menu-grid" id="menuGrid"></div>
    <div class="summary">
      <h3>현재 주문 내역</h3>
      <div id="summaryLines"><div class="empty">메뉴를 선택해 주세요</div></div>
      <div class="preorder-no" id="preNo"></div>
    </div>
    <div class="tumbler-wrap">
      <div class="tumbler-check" id="tumblerCheck">
        <div class="box" id="tumblerBox"></div>
        <div class="label">🥤 텀블러 사용</div>
      </div>
      <div class="notice">※ 텀블러가 아닌 음료는 분리해서 주문해 주세요.</div>
    </div>
    <div class="order-line">
      <button class="submit-btn" id="submitBtn" disabled>주문하기</button>
    </div>
  </div>

  <!-- 주문관리 -->
  <div class="panel" id="manPanel">
    <div class="section-title">⏳ 대기 중</div>
    <div id="waitList"></div>
    <div class="section-title">✅ 완료</div>
    <div id="doneList"></div>
  </div>

  <!-- 집계 -->
  <div class="panel" id="statPanel">
    <div class="total-box">
      <div class="num" id="totalNum">0</div>
      <div class="label">오늘 총 판매 잔</div>
    </div>
    <div id="statList"></div>
    <div class="soldout-section">
      <h3>메뉴 품절 관리</h3>
      <div id="soldoutList"></div>
    </div>
    <button class="reset-btn" id="resetBtn">오늘 데이터 초기화</button>
  </div>
</div>

<!-- 하단 탭 -->
<div class="tabbar">
  <div class="tab active" data-tab="orderPanel">주문</div>
  <div class="tab" data-tab="manPanel">주문관리<span class="badge" id="tabBadge" style="display:none">0</span></div>
  <div class="tab" data-tab="statPanel">집계</div>
</div>

<!-- 주문완료 팝업 -->
<div class="modal" id="doneModal">
  <div class="modal-box">
    <div class="check">✅</div>
    <div class="ttl">주문이 완료되었습니다</div>
    <div class="ono"><span id="modalNo">0</span><small>번</small></div>
    <div class="remember">📌 본인 주문번호를 꼭 기억해 주세요!</div>
    <div class="cnt" id="modalCnt"></div>
    <button class="close" id="modalClose">확인</button>
  </div>
</div>

<script>
// ===== Firebase =====
const firebaseConfig = {
  apiKey: "AIzaSyC989VKQk_3A9A8mKgu-Xb_8PL-xTwWLzw",
  authDomain: "medihub-cafe.firebaseapp.com",
  databaseURL: "https://medihub-cafe-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "medihub-cafe",
  storageBucket: "medihub-cafe.firebasestorage.app",
  messagingSenderId: "492629329248",
  appId: "1:492629329248:web:d1596f3ae376b9ba0a8a05"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const todayKey = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const ordersRef = () => db.ref('cafe/'+todayKey()+'/orders');
const soldoutRef = db.ref('cafe/soldout');
const callRef = db.ref('cafe/call');

// ===== 메뉴 =====
const MENU = [
  { id:'ame_h', name:'아메리카노', temp:'HOT', cls:'hot' },
  { id:'ame_i', name:'아메리카노', temp:'ICE', cls:'ice' },
  { id:'lat_h', name:'라떼', temp:'HOT', cls:'hot' },
  { id:'lat_i', name:'라떼', temp:'ICE', cls:'ice' },
  { id:'tea', name:'아이스티', temp:'ICE', cls:'ice' },
  { id:'ashot', name:'아샷추', temp:'ICE', cls:'ice' },
  { id:'espresso', name:'에스프레소', temp:'', cls:'' }
];
let cart = {};
let soldout = {};
let orders = {};
let tumbler = false;

// ===== 주문 화면 렌더 =====
function renderMenu(){
  const grid = document.getElementById('menuGrid');
  grid.innerHTML = '';
  MENU.forEach(m=>{
    const isSold = !!soldout[m.id];
    const q = cart[m.id]||0;
    const card = document.createElement('div');
    card.className = 'menu-card'+(isSold?' soldout':'');
    card.innerHTML = `
      <div class="name">${m.name}</div>
      <div class="temp ${m.cls}">${m.temp||'&nbsp;'}</div>
      <div class="qty-row">
        <button class="qty-btn minus" data-id="${m.id}" data-d="-1">−</button>
        <span class="qty-num">${q}</span>
        <button class="qty-btn" data-id="${m.id}" data-d="1">+</button>
      </div>
      ${isSold?'<div class="soldout-badge">SOLD OUT</div>':''}`;
    grid.appendChild(card);
  });
  grid.querySelectorAll('.qty-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id=b.dataset.id, d=parseInt(b.dataset.d);
      if(soldout[id]) return;
      cart[id]=Math.max(0,(cart[id]||0)+d);
      if(cart[id]===0) delete cart[id];
      renderMenu(); renderSummary();
    });
  });
}
function menuLabel(id){ const m=MENU.find(x=>x.id===id); return m.name+(m.temp?' ('+m.temp+')':''); }
function cartTotal(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function renderSummary(){
  const box = document.getElementById('summaryLines');
  const ids = Object.keys(cart);
  if(ids.length===0){ box.innerHTML='<div class="empty">메뉴를 선택해 주세요</div>'; document.getElementById('preNo').textContent=''; }
  else {
    let h='';
    ids.forEach(id=>{ h+=`<div class="line"><span>${menuLabel(id)}</span><span>${cart[id]}잔</span></div>`; });
    h+=`<div class="line total"><span>총 수량</span><span>${cartTotal()}잔</span></div>`;
    box.innerHTML=h;
    document.getElementById('preNo').textContent='내 주문번호: '+nextNo()+'번 (예상)';
  }
  document.getElementById('submitBtn').disabled = cartTotal()===0;
}

// ===== 주문번호 (빈번호 채우기) =====
function nextNo(){
  const used = Object.values(orders).map(o=>o.no).sort((a,b)=>a-b);
  let n=1;
  for(const u of used){ if(u===n) n++; else if(u>n) break; }
  return n;
}

// ===== 주문하기 =====
document.getElementById('submitBtn').addEventListener('click', ()=>{
  if(cartTotal()===0) return;
  const no = nextNo();
  const items = Object.keys(cart).map(id=>({ id, label:menuLabel(id), qty:cart[id] }));
  const order = { no, items, tumbler, status:'wait', ts:Date.now() };
  ordersRef().push(order);
  showDoneModal(no, items);
  cart={}; tumbler=false; renderTumbler(); renderMenu(); renderSummary();
});

function showDoneModal(no, items){
  document.getElementById('modalNo').textContent = no;
  document.getElementById('modalCnt').textContent = items.map(i=>i.label+' '+i.qty+'잔').join(', ');
  document.getElementById('doneModal').classList.add('show');
}
document.getElementById('modalClose').addEventListener('click', ()=>{
  document.getElementById('doneModal').classList.remove('show');
});

// ===== 텀블러 =====
const tumblerCheck = document.getElementById('tumblerCheck');
function renderTumbler(){
  const box = document.getElementById('tumblerBox');
  if(tumbler){ tumblerCheck.classList.add('on'); box.textContent='✓'; }
  else { tumblerCheck.classList.remove('on'); box.textContent=''; }
}
tumblerCheck.addEventListener('click', ()=>{ tumbler=!tumbler; renderTumbler(); });

// ===== 주문관리 렌더 =====
function fmtAgo(ts){ const m=Math.floor((Date.now()-ts)/60000); return m+'분 경과'; }
function renderManage(){
  const waitBox=document.getElementById('waitList');
  const doneBox=document.getElementById('doneList');
  const list = Object.entries(orders).map(([k,o])=>({key:k,...o})).sort((a,b)=>a.no-b.no);
  const waits = list.filter(o=>o.status==='wait');
  const dones = list.filter(o=>o.status==='done');
  waitBox.innerHTML = waits.length? '' : '<div class="empty-msg">대기 중인 주문이 없습니다</div>';
  dones.forEach; 
  waits.forEach(o=>waitBox.appendChild(card(o,true)));
  doneBox.innerHTML = dones.length? '' : '<div class="empty-msg">완료된 주문이 없습니다</div>';
  dones.forEach(o=>doneBox.appendChild(card(o,false)));
  // 배지
  const badge=document.getElementById('tabBadge');
  if(waits.length>0){ badge.style.display='inline-block'; badge.textContent=waits.length; }
  else badge.style.display='none';
}
function card(o, isWait){
  const warn = isWait && (Date.now()-o.ts)>=5*60000;
  const div=document.createElement('div');
  div.className='order-card'+(isWait?(warn?' warn':''):' done');
  const items = o.items.map(i=>`${i.label} <b>${i.qty}잔</b>`).join('<br>');
  let btns='';
  if(isWait){
    btns=`<div class="oc-btns">
      <button class="btn-call" data-act="call" data-no="${o.no}">🔊 음료 나왔습니다</button>
      <button class="btn-done" data-act="done" data-key="${o.key}">완료</button>
      <button class="btn-del" data-act="del" data-key="${o.key}">삭제</button>
    </div>`;
  } else {
    btns=`<div class="oc-btns">
      <button class="btn-wait" data-act="wait" data-key="${o.key}">대기로</button>
      <button class="btn-del" data-act="del" data-key="${o.key}">삭제</button>
    </div>`;
  }
  div.innerHTML = `
    <div class="oc-top"><span class="oc-no">${o.no}번</span>
      <span class="${warn?'oc-warn':'oc-time'}">${isWait?(warn?'⚠ '+fmtAgo(o.ts):fmtAgo(o.ts)):'완료'}</span></div>
    ${o.tumbler?'<span class="tumbler-badge">🥤 텀블러</span>':''}
    <div class="oc-items">${items}</div>
    ${btns}`;
  div.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const act=b.dataset.act;
      if(act==='call'){ speakCall(b.dataset.no); }
      else if(act==='done'){ ordersRef().child(b.dataset.key).update({status:'done'}); }
      else if(act==='wait'){ ordersRef().child(b.dataset.key).update({status:'wait'}); }
      else if(act==='del'){ if(confirm('삭제할까요?')) ordersRef().child(b.dataset.key).remove(); }
    });
  });
  return div;
}

// ===== 음성 호출 =====
function speak(text){
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ko-KR'; u.volume=1.0; u.rate=0.95; u.pitch=1.05;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
// A기기에서 호출 → Firebase에 신호 → 주문관리 켜둔 기기에서 음성
function speakCall(no){ callRef.set({ no, ts:Date.now() }); }
let lastCall=0;
callRef.on('value', s=>{
  const v=s.val(); if(!v) return;
  if(v.ts && v.ts!==lastCall){
    lastCall=v.ts;
    // 주문관리 탭이 열려 있는 기기에서만 음성
    if(document.getElementById('manPanel').classList.contains('active')){
      const t=v.no+'번 고객님, 음료 준비되었습니다';
      speak(t); setTimeout(()=>speak(t), 2200);
    }
  }
});

// ===== 집계 렌더 =====
function renderStat(){
  let total=0; const byMenu={};
  Object.values(orders).forEach(o=>{
    o.items.forEach(i=>{ total+=i.qty; byMenu[i.label]=(byMenu[i.label]||0)+i.qty; });
  });
  document.getElementById('totalNum').textContent=total;
  const sl=document.getElementById('statList');
  const keys=Object.keys(byMenu);
  sl.innerHTML = keys.length? keys.map(k=>`<div class="stat-row"><span>${k}</span><span class="cnt">${byMenu[k]}잔</span></div>`).join('') : '<div class="empty-msg">판매 내역이 없습니다</div>';
  // 품절 관리
  const so=document.getElementById('soldoutList');
  so.innerHTML = MENU.map(m=>{
    const isSold=!!soldout[m.id];
    return `<div class="so-row"><span class="so-name">${m.name}${m.temp?' ('+m.temp+')':''}</span>
      <button class="so-toggle ${isSold?'no':'ok'}" data-id="${m.id}">${isSold?'품절':'판매중'}</button></div>`;
  }).join('');
  so.querySelectorAll('.so-toggle').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id=b.dataset.id;
      soldoutRef.child(id).set(!soldout[id]);
    });
  });
}

// ===== 초기화 =====
document.getElementById('resetBtn').addEventListener('click', ()=>{
  const pw=prompt('초기화 비밀번호를 입력하세요');
  if(pw==='1234'){ ordersRef().remove(); alert('오늘 데이터가 초기화되었습니다.'); }
  else if(pw!==null){ alert('비밀번호가 틀렸습니다.'); }
});

// ===== 탭 전환 =====
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById(t.dataset.tab).classList.add('active');
  });
});

// ===== Firebase 리스너 =====
ordersRef().on('value', s=>{ orders=s.val()||{}; renderManage(); renderStat(); renderSummary(); });
soldoutRef.on('value', s=>{ soldout=s.val()||{}; renderMenu(); renderStat(); });
setInterval(renderManage, 30000); // 경과시간 갱신

// 초기 렌더
renderMenu(); renderSummary(); renderTumbler();
