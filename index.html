<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>동내로88 해밀 - 주문관리</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  body { background:#f4f6fa; color:#1a2b4a; padding-bottom:70px; }
  .panel { display:none; padding:14px; max-width:760px; margin:0 auto; }
  .panel.active { display:block; }
  .menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .menu-card { background:#fff; border:2px solid #d6e0f0; border-radius:14px; padding:12px 8px; text-align:center; position:relative; }
  .menu-card .name { font-size:16px; font-weight:bold; margin-bottom:6px; }
  .menu-card .name .hot { color:#c0392b; }
  .menu-card .name .ice { color:#2475d6; }
  .qty-row { display:flex; align-items:center; justify-content:center; gap:10px; }
  .qty-btn { width:38px; height:38px; border:none; border-radius:10px; background:#2475d6; color:#fff; font-size:22px; font-weight:bold; cursor:pointer; }
  .qty-btn.minus { background:#9fb3cc; }
  .qty-num { font-size:20px; font-weight:bold; min-width:26px; }
  .menu-card.soldout .qty-row { visibility:hidden; }
  .soldout-badge { display:none; position:absolute; inset:0; background:rgba(40,40,40,.78); color:#fff; border-radius:12px; align-items:center; justify-content:center; font-size:20px; font-weight:bold; letter-spacing:1px; }
  .menu-card.soldout .soldout-badge { display:flex; }
  .tumbler-box { background:#fff; border:2px solid #d6e0f0; border-radius:14px; padding:12px 14px; margin-top:10px; }
  .tumbler-check { display:flex; align-items:center; gap:10px; cursor:pointer; }
  .tumbler-check input { width:24px; height:24px; }
  .tumbler-check label { font-size:16px; font-weight:bold; cursor:pointer; }
  .tumbler-note { font-size:12px; color:#c0392b; margin-top:8px; }
  .cart-box { background:#eaf1fb; border-radius:14px; padding:12px 14px; margin-top:10px; }
  .cart-box .title { font-size:13px; color:#5a6b88; margin-bottom:6px; }
  .cart-list { font-size:15px; line-height:1.6; }
  .cart-total { font-size:17px; font-weight:bold; margin-top:6px; }
  .my-no { font-size:16px; font-weight:bold; color:#2475d6; margin-top:6px; }
  .order-btn { width:100%; background:#2475d6; color:#fff; border:none; border-radius:14px; padding:16px; font-size:19px; font-weight:bold; margin-top:10px; cursor:pointer; }
  .order-btn:disabled { background:#b9c6da; }
  .overlay { display:none; position:fixed; inset:0; background:rgba(20,40,80,.6); z-index:100; align-items:center; justify-content:center; padding:16px; }
  .overlay.show { display:flex; }
  .done-modal { background:#fff; border-radius:24px; width:100%; max-width:520px; height:66vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .done-modal .check { font-size:60px; }
  .done-modal .msg { font-size:26px; font-weight:bold; margin-top:12px; }
  .done-modal .bignum { font-size:90px; font-weight:900; color:#2475d6; line-height:1.1; margin:10px 0; }
  .done-modal .remember { font-size:18px; color:#c0392b; font-weight:bold; margin-top:8px; }
  .done-modal .closebtn { margin-top:24px; background:#2475d6; color:#fff; border:none; border-radius:14px; padding:14px 40px; font-size:18px; font-weight:bold; cursor:pointer; }
  .col-title { font-size:15px; font-weight:bold; color:#5a6b88; margin:14px 0 8px; }
  .order-card { background:#fff; border:2px solid #d6e0f0; border-radius:14px; padding:14px; margin-bottom:10px; }
  .order-card.waiting { border-color:#2475d6; }
  .order-card.warn { border-color:#e02424; background:#fff3f3; }
  .order-card.done { opacity:.6; }
  .oc-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .oc-no { font-size:22px; font-weight:900; color:#2475d6; }
  .oc-time { font-size:12px; color:#8a97ad; }
  .oc-time.warn { color:#e02424; font-weight:bold; }
  .tumbler-badge { display:inline-block; background:#1fa463; color:#fff; font-size:13px; font-weight:bold; padding:4px 10px; border-radius:20px; }
  .oc-items { font-size:15px; line-height:1.6; margin-bottom:10px; }
  .oc-btns { display:flex; gap:8px; flex-wrap:wrap; }
  .oc-btns button { flex:1; min-width:70px; border:none; border-radius:10px; padding:11px 6px; font-size:14px; font-weight:bold; cursor:pointer; }
  .b-call { background:#f39c12; color:#fff; }
  .b-done { background:#2475d6; color:#fff; }
  .b-wait { background:#9fb3cc; color:#fff; }
  .b-del { background:#fff; color:#e02424; border:2px solid #e02424; }
  .empty { text-align:center; color:#aab4c6; padding:24px; font-size:14px; }
  .total-box { background:#1a2b4a; color:#fff; border-radius:18px; padding:22px; text-align:center; margin-bottom:14px; }
  .total-box .num { font-size:46px; font-weight:900; }
  .total-box .label { font-size:13px; opacity:.8; }
  .stat-row { background:#fff; border-radius:10px; padding:12px 14px; margin-bottom:8px; display:flex; justify-content:space-between; font-size:15px; }
  .stat-row .cnt { font-weight:bold; color:#2475d6; }
  .sec-title { font-size:14px; font-weight:bold; color:#5a6b88; margin:16px 0 8px; }
  .soldout-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .so-toggle { border:2px solid #d6e0f0; background:#fff; border-radius:10px; padding:12px 6px; font-size:14px; font-weight:bold; cursor:pointer; }
  .so-toggle.off { background:#e02424; color:#fff; border-color:#e02424; }
  .reset-btn { width:100%; background:#fff; border:2px solid #e02424; color:#e02424; border-radius:12px; padding:14px; font-size:15px; font-weight:bold; margin-top:18px; cursor:pointer; }
  .tabs { position:fixed; bottom:0; left:0; right:0; display:flex; background:#fff; border-top:2px solid #e0e7f2; z-index:50; }
  .tab { flex:1; padding:14px 0; text-align:center; font-size:14px; font-weight:bold; color:#9aa6ba; cursor:pointer; position:relative; }
  .tab.active { color:#2475d6; }
  .tab .badge { position:absolute; top:6px; right:30%; background:#e02424; color:#fff; font-size:11px; font-weight:bold; min-width:18px; height:18px; line-height:18px; border-radius:9px; padding:0 4px; display:none; }
  .tab .badge.show { display:inline-block; }
</style>
</head>
<body>

<div class="panel active" id="orderPanel">
  <div class="menu-grid" id="menuGrid"></div>
  <div class="tumbler-box">
    <div class="tumbler-check">
      <input type="checkbox" id="tumblerChk">
      <label for="tumblerChk">🥤 텀블러 사용</label>
    </div>
    <div class="tumbler-note">※ 텀블러가 아닌 음료는 분리해서 주문해 주세요.</div>
  </div>
  <div class="cart-box">
    <div class="title">현재 주문 내역</div>
    <div class="cart-list" id="cartList">선택된 메뉴가 없습니다.</div>
    <div class="cart-total" id="cartTotal">총 0잔</div>
    <div class="my-no" id="myNo">내 주문번호: 1번</div>
  </div>
  <button class="order-btn" id="orderBtn" disabled>주문하기</button>
</div>

<div class="panel" id="manPanel">
  <div class="col-title">⏳ 대기 중</div>
  <div id="waitList"></div>
  <div class="col-title">✅ 완료</div>
  <div id="doneList"></div>
</div>

<div class="panel" id="statPanel">
  <div class="total-box">
    <div class="num" id="totalNum">0</div>
    <div class="label">오늘 총 판매 잔</div>
  </div>
  <div class="sec-title">메뉴별 판매</div>
  <div id="statList"></div>
  <div class="sec-title">메뉴 품절 관리</div>
  <div class="soldout-grid" id="soldoutGrid"></div>
  <button class="reset-btn" id="resetBtn">오늘 데이터 초기화</button>
</div>

<div class="overlay" id="overlay">
  <div class="done-modal">
    <div class="check">✅</div>
    <div class="msg">주문이 완료되었습니다</div>
    <div class="bignum" id="modalNum">1번</div>
    <div class="remember">⚠ 본인 주문번호를 꼭 기억해 주세요!</div>
    <button class="closebtn" id="modalClose">확인</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="orderPanel">주문</div>
  <div class="tab" data-tab="manPanel">주문관리<span class="badge" id="manBadge">0</span></div>
  <div class="tab" data-tab="statPanel">집계</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC989VKQk_3A9A8mKgu-Xb_8PL-xTwWLzw",
  authDomain: "medihub-cafe.firebaseapp.com",
  databaseURL: "https://medihub-cafe-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "medihub-cafe",
  storageBucket: "medihub-cafe.firebasestorage.app",
  messagingSenderId: "492629329248",
  appId: "1:492629329248:web:d1596f3ae376b9ba0a8a05"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ===== 메뉴 정의 ===== */
const MENUS = [
  { key:'ame_hot', label:'아메리카노', temp:'HOT' },
  { key:'ame_ice', label:'아메리카노', temp:'ICE' },
  { key:'latte_hot', label:'라떼', temp:'HOT' },
  { key:'latte_ice', label:'라떼', temp:'ICE' },
  { key:'icetea', label:'아이스티', temp:'' },
  { key:'ashotchu', label:'아샷추', temp:'' },
  { key:'espresso', label:'에스프레소', temp:'' }
];
function menuLabel(key){
  const m = MENUS.find(x=>x.key===key);
  if(!m) return key;
  return m.temp ? (m.label+' ('+m.temp+')') : m.label;
}

/* ===== 상태 ===== */
let cart = {};        // 현재 주문 담기 {key:qty}
let tumbler = false;
let orders = [];      // 오늘 주문 목록
let soldout = {};     // {key:true}
let nextNo = 1;
let lastCallTs = 0;   // 마지막으로 음성 낸 호출 ts
let lastNewOrderTs = 0; // 마지막으로 음성 낸 신규주문 ts
let firstLoaded = false;

function todayKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function ref(p){ return db.ref('hemil/'+todayKey()+(p?'/'+p:'')); }

/* ===== 한국어 숫자 읽기 (일번, 이번 ...) ===== */
function numToKor(n){
  const dig = ['','일','이','삼','사','오','육','칠','팔','구'];
  const unit10 = ['','십','이십','삼십','사십','오십','육십','칠십','팔십','구십'];
  n = parseInt(n,10);
  if(isNaN(n)) return '';
  if(n<=0) return '';
  if(n<10) return dig[n];
  if(n<100){
    const t = Math.floor(n/10), o = n%10;
    return unit10[t] + (o?dig[o]:'');
  }
  if(n<1000){
    const h = Math.floor(n/100), r = n%100;
    return (h>1?dig[h]:'') + '백' + (r?numToKor(r):'');
  }
  return String(n);
}

/* ===== 음성 (남자 목소리) ===== */
let krMaleVoice = null;
function pickVoice(){
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const kr = vs.filter(v=>/ko/i.test(v.lang));
  krMaleVoice = kr.find(v=>/male|남|minsu|injoon|Google.*한국|Microsoft.*(InJoon|Heami=)/i.test(v.name))
             || kr.find(v=>/InJoon/i.test(v.name))
             || kr[0] || null;
}
if(window.speechSynthesis){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked || !window.speechSynthesis) return;
  try{ const u = new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); audioUnlocked=true; }catch(e){}
}
document.addEventListener('click', unlockAudio, {once:false});
document.addEventListener('touchstart', unlockAudio, {once:false});

function speak(text, times){
  if(!window.speechSynthesis) return;
  times = times || 1;
  for(let i=0;i<times;i++){
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = 0.95;
    u.pitch = 0.7;   // 낮게 → 남성 톤
    u.volume = 1.0;
    if(krMaleVoice) u.voice = krMaleVoice;
    speechSynthesis.speak(u);
  }
}

/* ===== 렌더: 주문 화면 ===== */
function renderMenu(){
  const g = document.getElementById('menuGrid');
  g.innerHTML = '';
  MENUS.forEach(m=>{
    const qty = cart[m.key]||0;
    const so = !!soldout[m.key];
    const tempHtml = m.temp ? ' <span class="'+(m.temp==='HOT'?'hot':'ice')+'">'+m.temp+'</span>' : '';
    const div = document.createElement('div');
    div.className = 'menu-card'+(so?' soldout':'');
    div.innerHTML =
      '<div class="name">'+m.label+tempHtml+'</div>'+
      '<div class="qty-row">'+
        '<button class="qty-btn minus" data-k="'+m.key+'" data-d="-1">−</button>'+
        '<span class="qty-num">'+qty+'</span>'+
        '<button class="qty-btn" data-k="'+m.key+'" data-d="1">+</button>'+
      '</div>'+
      '<div class="soldout-badge">SOLD OUT</div>';
    g.appendChild(div);
  });
  g.querySelectorAll('.qty-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const k = b.getAttribute('data-k');
      const d = parseInt(b.getAttribute('data-d'),10);
      if(soldout[k]) return;
      const cur = cart[k]||0;
      const nv = Math.max(0, cur+d);
      if(nv===0) delete cart[k]; else cart[k]=nv;
      renderCart();
      renderMenu();
    });
  });
}
function renderCart(){
  const list = document.getElementById('cartList');
  const totalEl = document.getElementById('cartTotal');
  const keys = Object.keys(cart);
  let total = 0;
  if(keys.length===0){
    list.textContent = '선택된 메뉴가 없습니다.';
  } else {
    list.innerHTML = keys.map(k=>{ total+=cart[k]; return menuLabel(k)+' '+cart[k]+'잔'; }).join('<br>');
  }
  keys.forEach(k=>{ if(!cart[k]) total+=0; });
  total = keys.reduce((s,k)=>s+cart[k],0);
  totalEl.textContent = '총 '+total+'잔';
  document.getElementById('myNo').textContent = '내 주문번호: '+nextNo+'번';
  document.getElementById('orderBtn').disabled = total===0;
}

/* ===== 다음 주문번호 (빈번호 채우기) ===== */
function computeNextNo(){
  const used = new Set(orders.map(o=>o.no));
  let n = 1;
  while(used.has(n)) n++;
  return n;
}

/* ===== 주문 등록 ===== */
document.getElementById('orderBtn').addEventListener('click', ()=>{
  const keys = Object.keys(cart);
  if(keys.length===0) return;
  const items = keys.map(k=>({ key:k, qty:cart[k] }));
  const total = items.reduce((s,i)=>s+i.qty,0);
  const no = computeNextNo();
  const ts = Date.now();
  const order = { no:no, items:items, total:total, tumbler:tumbler, status:'wait', ts:ts };
  ref('orders').push(order);
  // 주문 완료 음성 (모든 기기에서 울리도록 신호 push)
  ref('orderSound').set({ no:no, ts:ts });
  // 모달
  document.getElementById('modalNum').textContent = no+'번';
  document.getElementById('overlay').classList.add('show');
  // 초기화
  cart = {}; tumbler=false;
  document.getElementById('tumblerChk').checked = false;
  renderMenu(); renderCart();
});
document.getElementById('modalClose').addEventListener('click', ()=>{
  document.getElementById('overlay').classList.remove('show');
});
document.getElementById('tumblerChk').addEventListener('change', e=>{ tumbler = e.target.checked; });

/* ===== 렌더: 주문관리 ===== */
function renderManage(){
  const wl = document.getElementById('waitList');
  const dl = document.getElementById('doneList');
  wl.innerHTML=''; dl.innerHTML='';
  const waits = orders.filter(o=>o.status==='wait').sort((a,b)=>a.ts-b.ts);
  const dones = orders.filter(o=>o.status==='done').sort((a,b)=>b.ts-a.ts);
  const now = Date.now();
  if(waits.length===0) wl.innerHTML='<div class="empty">대기 중인 주문이 없습니다.</div>';
  waits.forEach(o=>wl.appendChild(card(o,now,true)));
  if(dones.length===0) dl.innerHTML='<div class="empty">완료된 주문이 없습니다.</div>';
  dones.forEach(o=>dl.appendChild(card(o,now,false)));
  // 배지
  const badge = document.getElementById('manBadge');
  if(waits.length>0){ badge.textContent=waits.length; badge.classList.add('show'); }
  else badge.classList.remove('show');
}
function card(o, now, isWait){
  const div = document.createElement('div');
  const min = Math.floor((now-o.ts)/60000);
  const warn = isWait && min>=5;
  div.className = 'order-card '+(isWait?(warn?'warn':'waiting'):'done');
  const itemsHtml = (o.items||[]).map(i=>menuLabel(i.key)+' '+i.qty+'잔').join('<br>');
  const timeHtml = isWait ? '<span class="oc-time'+(warn?' warn':'')+'">'+min+'분 경과'+(warn?' ⚠':'')+'</span>' : '<span class="oc-time">완료</span>';
  const tumblerHtml = o.tumbler ? ' <span class="tumbler-badge">🥤 텀블러</span>' : '';
  let btns = '';
  if(isWait){
    btns = '<button class="b-call" data-act="call" data-id="'+o.id+'">🔊 음료</button>'+
           '<button class="b-done" data-act="done" data-id="'+o.id+'">완료</button>'+
           '<button class="b-del" data-act="del" data-id="'+o.id+'">삭제</button>';
  } else {
    btns = '<button class="b-call" data-act="call" data-id="'+o.id+'">🔊 음료</button>'+
           '<button class="b-wait" data-act="wait" data-id="'+o.id+'">대기로</button>'+
           '<button class="b-del" data-act="del" data-id="'+o.id+'">삭제</button>';
  }
  div.innerHTML =
    '<div class="oc-head"><span class="oc-no">'+o.no+'번</span>'+timeHtml+'</div>'+
    '<div class="oc-items">'+itemsHtml+tumblerHtml+'</div>'+
    '<div class="oc-btns">'+btns+'</div>';
  div.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.getAttribute('data-id');
      const act = b.getAttribute('data-act');
      if(act==='call'){ ref('callSound').set({ no:o.no, ts:Date.now() }); }
      else if(act==='done'){ ref('orders/'+id).update({ status:'done' }); }
      else if(act==='wait'){ ref('orders/'+id).update({ status:'wait' }); }
      else if(act==='del'){ if(confirm(o.no+'번 주문을 삭제할까요?')) ref('orders/'+id).remove(); }
    });
  });
  return div;
}

/* ===== 렌더: 집계 ===== */
function renderStat(){
  let total = 0;
  const per = {};
  MENUS.forEach(m=>per[m.key]=0);
  orders.forEach(o=>{
    (o.items||[]).forEach(i=>{ per[i.key]=(per[i.key]||0)+i.qty; total+=i.qty; });
  });
  document.getElementById('totalNum').textContent = total;
  const sl = document.getElementById('statList');
  sl.innerHTML = MENUS.map(m=>
    '<div class="stat-row"><span>'+menuLabel(m.key)+'</span><span class="cnt">'+(per[m.key]||0)+'잔</span></div>'
  ).join('');
  // 품절 토글
  const sg = document.getElementById('soldoutGrid');
  sg.innerHTML = '';
  MENUS.forEach(m=>{
    const off = !!soldout[m.key];
    const btn = document.createElement('button');
    btn.className = 'so-toggle'+(off?' off':'');
    btn.textContent = menuLabel(m.key)+(off?' (품절)':'');
    btn.addEventListener('click', ()=>{
      const ns = Object.assign({}, soldout);
      if(off) delete ns[m.key]; else ns[m.key]=true;
      ref('soldout').set(ns);
    });
    sg.appendChild(btn);
  });
}
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('오늘 데이터를 모두 초기화할까요?')){
    ref('orders').remove();
    ref('soldout').remove();
  }
});

/* ===== 탭 ===== */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById(t.getAttribute('data-tab')).classList.add('active');
  });
});

/* ===== 현재 주문관리 탭이 보이는지 ===== */
function isManageOpen(){ return document.getElementById('manPanel').classList.contains('active'); }

/* ===== Firebase 실시간 구독 ===== */
ref('orders').on('value', snap=>{
  const val = snap.val() || {};
  orders = Object.keys(val).map(id=>Object.assign({ id:id }, val[id]));
  nextNo = computeNextNo();
  renderCart();
  renderManage();
  renderStat();
});
ref('soldout').on('value', snap=>{
  soldout = snap.val() || {};
  renderMenu();
  renderStat();
});

/* ===== 주문완료 음성: 모든 기기 ===== */
ref('orderSound').on('value', snap=>{
  const v = snap.val();
  if(!v || !v.ts) return;
  if(!firstLoaded){ lastNewOrderTs = v.ts; return; }
  if(v.ts > lastNewOrderTs){
    lastNewOrderTs = v.ts;
    speak(numToKor(v.no)+'번 주문 완료되었습니다.', 1);
  }
});
/* ===== 음료 호출 음성: 주문관리 탭 띄운 기기 ===== */
ref('callSound').on('value', snap=>{
  const v = snap.val();
  if(!v || !v.ts) return;
  if(!firstLoaded){ lastCallTs = v.ts; return; }
  if(v.ts > lastCallTs){
    lastCallTs = v.ts;
    if(isManageOpen() || true){
      speak(numToKor(v.no)+'번 음료 준비되었습니다.', 2);
    }
  }
});

/* 첫 로드 표시 (기존 신호로 즉시 울리지 않게) */
setTimeout(()=>{ firstLoaded = true; }, 1500);

/* ===== 경과시간 갱신 ===== */
setInterval(()=>{ if(orders.length) renderManage(); }, 30000);

/* 초기 렌더 */
renderMenu();
renderCart();
</script>
